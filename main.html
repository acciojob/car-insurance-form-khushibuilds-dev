<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
<form method="post">
	<label for="name">Name</label>
	<input type="text" required id="name">

	
	<label for="email">Email</label>
	<input type="email" required id="email">

    <label for="female">Female</label>
	<input type="radio" name="gender" id="female" value="female" required>


    <label for="male">Male</label>
	<input type="radio" name="gender" id="male" value="male" required>

	
	<label for=""></label>
	<input type="" required id="">
	
	<label for="cars">Car Brands</label>
	<select id="cars">
		<option>BMW</option>
		<option>Audi</option>
		<option>Mercedez</option>
	</select>

	
	<label for="carage">Car Age</label>
	<input type="number" required id="carage">

	
	<label for="dop">Date of Purchase(dop)</label>
	<input type="date" required id="dop" required>

	
	<label for="password">Password</label>
	<input type="password" required id="password">

	<button type="submit">Submit Button</button>
</form>
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
